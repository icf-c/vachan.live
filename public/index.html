<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vachan · reads the web aloud</title>
  <meta name="description" content="Vachan reads any web page aloud in a natural voice, on your own computer. Open source, and 100% local if you want. Coming soon.">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="canonical" href="https://vachan.live/">
  <meta property="og:title" content="Vachan · reads the web aloud">
  <meta property="og:description" content="Reads the page aloud, on your machine. Open source, and 100% local if you want.">
  <meta property="og:image" content="https://media.vachan.live/poster.jpg">
  <meta property="og:url" content="https://vachan.live/">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    /* The demo's own look: the warm radial ground the hero cards and the
       store composites sit on, the orange accent of the icon and the pill,
       SF-style type with tight tracking, the end card's dark close. */
    :root {
      --ink: #1d1d1f; --muted: #5c5c63; --accent: #c2410c; --accent-soft: #fb923c;
      --ground: radial-gradient(120% 90% at 50% 0%, #fff4e6 0%, #f3f4f7 55%, #e9ebf0 100%);
      --ground-flat: #f3f4f7; --card: #ffffff; --line: rgba(29,29,31,.12); --dark: #0b0b0d;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #f5f5f7; --muted: #a7a5a0; --ground: radial-gradient(120% 90% at 50% 0%, #2a1f16 0%, #141416 55%, #0e0e10 100%);
              --ground-flat: #141416; --card: #1c1c1f; --line: rgba(245,245,247,.14); }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font: 18px/1.5 -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans", sans-serif;
      color: var(--ink); background: var(--ground-flat); background-image: var(--ground); background-attachment: fixed;
    }
    main { max-width: 1040px; margin: 0 auto; padding: 64px 20px 0; }
    header { display: flex; align-items: center; gap: 20px; margin-bottom: 26px; }
    header img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 8px 24px rgba(194,65,12,.25); }
    .names { line-height: 1.05; }
    .mr { font-family: "Kohinoor Devanagari", "Devanagari MT", "Noto Sans Devanagari", sans-serif; font-size: 26px; color: var(--muted); font-weight: 600; }
    h1 { font-size: 52px; letter-spacing: -0.025em; margin: 2px 0 0; font-weight: 700; }
    .lede { font-size: 26px; line-height: 1.3; letter-spacing: -0.01em; max-width: 680px; margin: 0 0 36px; }
    .lede b { font-weight: 600; color: var(--accent); }
    .video { border-radius: 18px; overflow: hidden; background: #000; box-shadow: 0 30px 80px rgba(20,20,30,.22), 0 2px 6px rgba(0,0,0,.08); aspect-ratio: 16 / 9; }
    video { display: block; width: 100%; height: 100%; }
    section.join {
      margin: 56px 0 0; padding: 56px 20px 48px; background: var(--dark); color: #f5f5f7;
    }
    section.join .inner { max-width: 1040px; margin: 0 auto; }
    section.join .soon { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: #fb923c; margin: 0 0 10px; font-weight: 600; }
    section.join h2 { font-size: 34px; letter-spacing: -0.02em; margin: 0 0 8px; font-weight: 700; }
    section.join p { margin: 0 0 22px; color: #b8b6b1; max-width: 560px; }
    form { display: flex; flex-wrap: wrap; gap: 10px; max-width: 620px; }
    input[type=email] {
      flex: 1 1 280px; font: inherit; padding: 13px 16px; border: 1px solid rgba(255,255,255,.18); border-radius: 12px; background: #1a1a1d; color: #f5f5f7;
    }
    input[type=email]::placeholder { color: #7d7b77; }
    input[type=email]:focus { outline: 2px solid var(--accent-soft); outline-offset: 1px; border-color: var(--accent-soft); }
    button {
      font: inherit; font-weight: 600; padding: 13px 22px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; cursor: pointer;
      box-shadow: 0 8px 24px rgba(194,65,12,.35);
    }
    button:hover { background: #a3360a; }
    button[disabled] { opacity: .6; cursor: default; }
    .beta { flex-basis: 100%; display: flex; align-items: center; gap: 10px; color: #d6d4cf; font-size: 16px; cursor: pointer; margin: 2px 0 4px; }
    .beta input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
    .cf-turnstile { flex-basis: 100%; }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .status { flex-basis: 100%; min-height: 1.5em; margin: 0; color: #b8b6b1; }
    .status.ok { color: #7ed49a; }
    .status.err { color: #ff9c8a; }
    footer { max-width: 1040px; margin: 0 auto; padding: 26px 20px 36px; color: #8a8883; font-size: 15px; display: flex; flex-wrap: wrap; gap: 8px 24px; }
    footer a { color: inherit; }
    .wrap-dark { background: var(--dark); }
    @media (max-width: 600px) {
      main { padding-top: 36px; }
      h1 { font-size: 40px; }
      .lede { font-size: 21px; }
      header img { width: 56px; height: 56px; border-radius: 14px; }
      section.join h2 { font-size: 28px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <img src="/logo.svg" alt="" width="64" height="64">
    <div class="names">
      <div class="mr" lang="mr">वाचन</div>
      <h1>Vachan</h1>
    </div>
  </header>

  <p class="lede">Reads the page aloud, on your machine. <b>Open source, and 100% local if you want.</b></p>

  <div class="video">
    <video controls playsinline preload="metadata" poster="https://media.vachan.live/poster.jpg">
      <source src="https://media.vachan.live/demo.mp4" type="video/mp4">
    </video>
  </div>

</main>
<section class="join" id="join">
    <div class="inner">
      <p class="soon">Coming soon</p>
      <h2>Hear it first.</h2>
      <p>One email when it ships. Nothing else, and nothing shared.</p>
      <form id="join-form" method="post" action="/subscribe" novalidate>
        <label class="hp" aria-hidden="true">Leave this empty <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
        <label class="hp" for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" maxlength="254" required>
        <button type="submit" id="join-btn">Email me when it ships</button>
        <label class="beta"><input type="checkbox" name="beta" value="yes"> I'd test a beta before it ships</label>
        <div class="cf-turnstile" data-sitekey="__TURNSTILE_SITE_KEY__" data-size="flexible" data-theme="dark"></div>
        <p class="status" id="join-status" role="status" aria-live="polite"></p>
      </form>
    </div>
</section>
<div class="wrap-dark">
  <footer>
    <span>By <a href="https://icf-c.com">ICF Computers</a></span>
    <span>Open source</span>
    <span><a href="mailto:vachan@icf-c.com">vachan@icf-c.com</a></span>
  </footer>
</div>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script>
  // Posts the form as JSON to the Pages Function at /subscribe. Without
  // JavaScript the form still posts; the function answers with plain text.
  const form = document.getElementById('join-form');
  const status = document.getElementById('join-status');
  const btn = document.getElementById('join-btn');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    status.className = 'status';
    status.textContent = '';
    const data = Object.fromEntries(new FormData(form).entries());
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(data.email || '')) {
      status.className = 'status err';
      status.textContent = 'That does not look like an email address.';
      return;
    }
    btn.disabled = true;
    try {
      const r = await fetch('/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
      const out = await r.json().catch(() => ({}));
      if (r.ok && out.ok) {
        status.className = 'status ok';
        status.textContent = out.already ? 'You are already on the list.' : (data.beta ? 'Noted, and you are on the beta list.' : 'Noted. One email when it ships.');
        form.reset();
      } else {
        status.className = 'status err';
        status.textContent = out.error || 'Could not save that. Write to vachan@icf-c.com and it will reach me.';
        if (window.turnstile) window.turnstile.reset();
      }
    } catch {
      status.className = 'status err';
      status.textContent = 'Could not reach the server. Write to vachan@icf-c.com and it will reach me.';
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
